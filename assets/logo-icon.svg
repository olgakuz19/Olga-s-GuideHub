<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Olga's GuideHub">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;display=swap');
      .logo-small { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 72px; font-weight: 400; fill: #7A5568; letter-spacing: 10px; }
      .logo-main  { font-family: 'Playfair Display', Georgia, 'Times New Roman', serif; font-size: 130px; font-weight: 700; fill: #5C3357; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- Light pink background -->
  <rect width="800" height="800" fill="#FDF0F6"/>

  <!-- Star icon centered horizontally, upper portion -->
  <!-- Scale up the star from logo.svg (was 50x50, center 25,25) — scale ×8, center at 400,310 -->
  <path d="M400,166 L432,270 L512,310 L432,350 L400,454 L368,350 L288,310 L368,270 Z"
        fill="#C4789A"/>
  <circle cx="400" cy="310" r="26" fill="#5C3357"/>

  <!-- Text: OLGA'S -->
  <text x="400" y="555" class="logo-small" text-anchor="middle">OLGA'S</text>

  <!-- Text: GuideHub -->
  <text x="400" y="670" class="logo-main" text-anchor="middle">GuideHub</text>

</svg>
